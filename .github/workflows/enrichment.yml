name: Company Enrichment Pipeline

# Milestone 24 — everything that is NOT freshness-critical for /jobs:
# GitHub repository data and the Company-level Scoring/Classification/
# Technology/Matching/Decision pipelines. Deliberately a separate
# workflow file from job-ingestion.yml, on a much less frequent
# schedule, so a failure or slowdown here can never affect the core job
# feed (governing directive, Part 10) - not just step- or job-level
# isolation within one workflow, but full workflow-level isolation.
#
# Why GitHub repo collection moved here instead of staying on the 6h job
# schedule: real production evidence found (a) the configured
# GITHUB_TOKEN is invalid (a direct API call returns "Bad credentials"),
# so every run was failing outright, and (b) even fixed, GitHub repo
# data feeds only Technology Detection - a Company-profile enrichment
# feature with zero contribution to /jobs, /today, or /outreach (the
# actual job-hunting surfaces). Once-daily is a generous cadence for
# data that changes on the order of weeks (a company's repos/stack), not
# hours - see README.md's "Automating the pipeline" section.
#
# Why Scoring/Classification/Technology/Matching/Decision moved off the
# 6h schedule too: none of them make job data fresher - only the
# Collectors and Job classification (job-ingestion.yml) do that. Running
# them every 6h against a largely-unchanged company/opportunity set is
# exactly the "blindly run everything every 6 hours" the governing
# directive's Part 9 asks to stop doing; once daily is enough for a
# scoring/recommendation layer whose own upstream Company data changes
# on the order of days, not hours.
on:
  schedule:
    - cron: "0 3 * * *" # once daily, 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: company-enrichment-pipeline
  cancel-in-progress: false

jobs:
  enrich:
    name: GitHub, score, classify, detect, match, decide
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write environment file
        # GITHUB_TOKEN here is the token GitHub automatically provides to
        # every workflow run (raises the collector's rate limit from
        # 60/hr to ~1,000/hr for this repo) - not a secret to create. If
        # GitHub enrichment stays disabled (see README), this step and
        # the "Collect - GitHub" step below are harmless no-ops.
        run: |
          cat > apps/web/.env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          EOF

      # Each step isolated with continue-on-error - none of this is on
      # the freshness-critical path, so one failure should never block
      # a later, independent step from still getting a chance to run.
      # `continue-on-error: true` forces every step's own *conclusion* to
      # "success" regardless of what actually happened - GitHub Actions
      # only exposes the real result via `steps.<id>.outcome` - which is
      # why a dead collector used to produce a fully green run (Stage 7's
      # release-readiness review). The three steps this pipeline's own
      # product depends on for the security feed - DefiLlama, Immunefi,
      # and security scoring - are each given an `id` and checked by name
      # in "Fail if required security enrichment steps failed" below,
      # which runs last (`if: always()`) specifically so every step above
      # still gets to run for diagnostics before the job's own outcome is
      # decided. Every other step here (GitHub, company scoring,
      # classify/detect/match/decide, the prune step) stays genuinely
      # optional by design, same as before this change: none of them feed
      # /jobs, /today, or /outreach, and GitHub enrichment in particular is
      # documented above as a routine no-op when disabled - gating the job
      # on their success would be a new, unapproved behavior change, not
      # a fix for the failure-visibility gap Stage 7 found.
      - name: Collect - GitHub
        run: pnpm --filter @web3-hunter/web collect:github
        continue-on-error: true

      - name: Collect - DefiLlama (security intelligence)
        id: collect-defillama
        run: pnpm --filter @web3-hunter/web collect:defillama
        continue-on-error: true

      - name: Collect - Immunefi (security intelligence)
        id: collect-immunefi
        run: pnpm --filter @web3-hunter/web collect:immunefi
        continue-on-error: true

      # Checks each Security Target's already-known website/repository for
      # a published RFC 9116 `security.txt` or GitHub `SECURITY.md` —
      # optional, like "Collect - GitHub" above: a fraction of the
      # external websites it checks being unreachable, rate-limited, or
      # blocking non-browser requests on any given day is routine, not a
      # pipeline failure, and this never feeds /jobs, /today, or
      # /outreach. Its own Collector Health row (`security-disclosure`)
      # still records every run's real outcome, visible via the existing
      # `/api/collectors` endpoint, independently of this step's
      # `continue-on-error`.
      - name: Collect - Security disclosure routes (security.txt, GitHub policy)
        run: pnpm --filter @web3-hunter/web collect:security-disclosure
        continue-on-error: true

      - name: Score companies
        run: pnpm --filter @web3-hunter/web score:companies
        continue-on-error: true

      - name: Score security targets
        id: score-security
        run: pnpm --filter @web3-hunter/web score:security
        continue-on-error: true

      - name: Classify opportunities
        run: pnpm --filter @web3-hunter/web classify:opportunities
        continue-on-error: true

      - name: Detect technology
        run: pnpm --filter @web3-hunter/web detect:technology
        continue-on-error: true

      - name: Match users
        run: pnpm --filter @web3-hunter/web match:users
        continue-on-error: true

      - name: Decide recommendations
        run: pnpm --filter @web3-hunter/web decide:recommendations
        continue-on-error: true

      - name: Prune old pipeline_run history
        # Milestone 24: pipeline_run is pure operational telemetry (see
        # packages/db/src/schema/pipeline-run.ts's own doc comment) with
        # no product read-dependency - it was 80MB/254k rows (29% of the
        # entire database) with no retention policy. Safe to run daily
        # regardless of the stages above succeeding or not.
        run: pnpm --filter @web3-hunter/web maintenance:prune-pipeline-runs
        continue-on-error: true

      - name: Fail if required security enrichment steps failed
        # Stage 7's release-readiness review found this workflow could
        # report a fully green run even if DefiLlama, Immunefi, and
        # security scoring all failed outright - `continue-on-error`
        # masks each step's real result in its `conclusion`, so this
        # reads `outcome` instead, which still reflects what actually
        # happened. `if: always()` makes this check run even when an
        # earlier required step failed, so the job's final result is
        # never decided before every step above has had its chance to
        # run. Scoped to exactly the three steps above with an `id` -
        # every other step in this job remains intentionally optional,
        # per this file's existing documented design.
        if: always()
        run: |
          failed=""
          if [ "${{ steps.collect-defillama.outcome }}" = "failure" ]; then
            failed="$failed collect-defillama"
          fi
          if [ "${{ steps.collect-immunefi.outcome }}" = "failure" ]; then
            failed="$failed collect-immunefi"
          fi
          if [ "${{ steps.score-security.outcome }}" = "failure" ]; then
            failed="$failed score-security"
          fi
          if [ -n "$failed" ]; then
            echo "::error::Required security enrichment step(s) failed:$failed"
            exit 1
          fi
          echo "All required security enrichment steps succeeded."
