name: Job Ingestion Pipeline

# Milestone 24 — the CORE, freshness-critical path only: the three ATS
# job collectors plus job classification. Nothing else. This workflow
# adds no new ingestion logic - every job below runs the exact same
# `pnpm --filter @web3-hunter/web <script>` command already documented
# in README.md's "Populating data" section.
#
# Split into separate JOBS (not sequential steps in one job, as
# Milestone 23 originally had it) so a crash, hang, or runner-level
# failure in one collector cannot prevent the others - or job
# classification - from running. Milestone 24's real production
# measurement found Greenhouse fresh (hours old) while Lever/Ashby sat
# stale for days despite all three being steps in the same job with
# `continue-on-error: true` - step-level isolation wasn't enough; job-
# level isolation (separate runners entirely) is the actually-reliable
# fix. `.github/workflows/enrichment.yml` covers everything else
# (GitHub repo data, company scoring/classification/technology/matching/
# decision) on its own, much less frequent schedule - see that file for
# why those are deliberately NOT here.
on:
  schedule:
    # Every 12 hours - 00:00, 12:00 UTC. Milestone 26: halved from every
    # 6 hours specifically to cut GitHub Actions minutes (~4,320/month
    # projected at 6h even after the collector-batching fixes, still over
    # the 2,000/month free-tier budget) - job data a few hours older is
    # an acceptable trade for a personal job-hunting tool, per that
    # milestone's measurement.
    - cron: "0 */12 * * *"
  workflow_dispatch: {} # manual "Run workflow" button, for testing

concurrency:
  group: job-ingestion-pipeline
  cancel-in-progress: false

jobs:
  collect-greenhouse:
    name: Collect - Greenhouse
    runs-on: ubuntu-latest
    # Real measured duration: 24m35s against ~500 tracked companies.
    # Generous headroom for data growth; GitHub's own ceiling is 360
    # (Free tier) if this value is ever exceeded.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write environment file
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > apps/web/.env
      - run: pnpm --filter @web3-hunter/web collect:greenhouse

  collect-lever:
    name: Collect - Lever
    runs-on: ubuntu-latest
    # Real measured duration: 5m31s. Padded for headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write environment file
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > apps/web/.env
      - run: pnpm --filter @web3-hunter/web collect:lever

  collect-ashby:
    name: Collect - Ashby
    runs-on: ubuntu-latest
    # Real measured duration: 23m40s against ~500 tracked companies.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write environment file
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > apps/web/.env
      - run: pnpm --filter @web3-hunter/web collect:ashby

  classify-jobs:
    name: Classify jobs
    needs: [collect-greenhouse, collect-lever, collect-ashby]
    # Runs regardless of whether any collector above failed - it
    # classifies whatever JobPosted/JobUpdated Events exist so far;
    # per-entity isolation inside the classifier itself (unchanged) means
    # a failed collector just means fewer new jobs to classify this run,
    # not a blocked run. This is the direct fix for "one failed stage
    # must not prevent later stages" (governing directive, Part 10).
    if: always()
    runs-on: ubuntu-latest
    # Real measured duration: 11m46s over ~1,500 open postings.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write environment file
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > apps/web/.env
      - run: pnpm --filter @web3-hunter/web classify:jobs
